# Link-preview crawlers (Slack, Discord, iMessage, Twitter, WhatsApp, Facebook,
# LinkedIn, Telegram, Google) can't run JavaScript, so a client-rendered SPA route
# unfurls as a bare URL. Route just those user-agents to the backend's
# server-rendered preview endpoint; everyone else gets the app as usual.
map $http_user_agent $is_crawler {
  default                                                              0;
  "~*(slackbot|discordbot|twitterbot|facebookexternalhit|linkedinbot)"  1;
  "~*(whatsapp|telegrambot|skypeuripreview|embedly|quora link preview)" 1;
  "~*(bitlybot|redditbot|applebot|googlebot|bingbot|pinterest)"         1;
  "~*(vkshare|w3c_validator|outbrain|nuzzel|iframely)"                  1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Tell the backend which origin the client actually used, so the links it mints
  # (share URLs, artifact URLs, canonical preview URLs) point back at this host
  # rather than at whatever ARTIFACTBAY_BASE_URL was configured to.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # API + artifact routes proxy to the backend service.
  location /v0/ {
    proxy_pass http://backend:8000;
    # Artifacts can be large; don't buffer the whole body.
    proxy_buffering off;
    client_max_body_size 60m;
  }
  location = /health {
    proxy_pass http://backend:8000/health;
  }

  # Shared session links: crawlers get Open Graph metadata, humans get the SPA.
  # Only `proxy_pass` is permitted inside `if`, so the headers are set above at
  # server level and inherited here.
  location ~ ^/s/(?<share_id>[^/]+)$ {
    if ($is_crawler) {
      proxy_pass http://backend:8000/v0/preview/s/$share_id$is_args$args;
    }
    try_files $uri /index.html;
  }

  # Same for single-artifact links.
  location ~ ^/a/(?<artifact_id>[^/]+)$ {
    if ($is_crawler) {
      proxy_pass http://backend:8000/v0/preview/a/$artifact_id$is_args$args;
    }
    try_files $uri /index.html;
  }

  # SPA: serve static assets, fall back to index.html for client routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
